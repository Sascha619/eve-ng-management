# Lab-Stack für ansible-tam: NetBox (Source of Truth) + Semaphore (Ansible-UI).
# Projektname bleibt eve-ng-management — ansible-tam/backups/netbox-*.sh
# sprechen die Container über diesen Namen an.
name: eve-ng-management

x-netbox: &netbox
  # 4.6.5 wie die Kunden-NetBox (Export per ansible-tam/ansible/scripts/
  # dump_netbox_ilbs.py); GraphQL-Schema der Playbooks siehe
  # roles/netbox_fetch/README.md; plus Plugin netbox-routing.
  build:
    context: .
    dockerfile: Dockerfile.netbox
  image: eve-ng-netbox:v4.6.5
  env_file: netbox.env
  volumes:
    - netbox-media:/opt/netbox/netbox/media
    - netbox-reports:/opt/netbox/netbox/reports
    - netbox-scripts:/opt/netbox/netbox/scripts
  restart: unless-stopped

services:
  # ============================================================
  # NetBox - Network Source of Truth
  # ============================================================
  netbox:
    <<: *netbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8080"
    # healthy erst nach den Migrationen — der Worker crasht sonst auf
    # fehlenden Tabellen (core_job), solange NetBox noch migriert.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login/ || exit 1"]
      start_period: 300s
      interval: 15s
      timeout: 5s
      retries: 3

  # Housekeeping läuft seit NetBox 4.2 als System-Job im Worker.
  netbox-worker:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py rqworker

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netbox_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Semaphore - Ansible UI
  # ============================================================
  semaphore:
    build:
      context: .
      dockerfile: Dockerfile.semaphore
    image: eve-ng-semaphore:latest
    depends_on:
      semaphore-db:
        condition: service_healthy
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: semaphore-db
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: ${SEMAPHORE_DB_PASSWORD:-semaphore_secret}
      SEMAPHORE_DB: semaphore
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:-admin}
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION}
    # Lab-Geräte und EVE über die Port-Forwards auf dem Host
    # (lab/eve-forwards.sh, gebunden an die Docker-Bridge).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - semaphore-data:/var/lib/semaphore
      - ./ansible:/opt/semaphore/playbooks
      # ansible-tam als lokales Git-Repo (Semaphore klont per file://).
      - ../ansible-tam:/opt/repos/ansible-tam:ro
    ports:
      - "127.0.0.1:3010:3000"
    restart: unless-stopped

  semaphore-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: semaphore
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: ${SEMAPHORE_DB_PASSWORD:-semaphore_secret}
    volumes:
      - semaphore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaphore"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# Festes Subnetz: Docker würde sonst 172.18.0.0/16 vergeben und mit den
# 172.18.x-Netzen des Kunden kollidieren.
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.0.0/24

volumes:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  postgres-data:
  redis-data:
  semaphore-data:
  semaphore-db-data:
